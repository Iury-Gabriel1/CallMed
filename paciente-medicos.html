  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = Storage.getUsuarioLogado();
      if (!user || user.tipo !== 'paciente') {
        window.location.href = 'login.html';
        return;
      }

      // Aplica tema
      const config = Storage.getConfiguracoes();
      document.documentElement.setAttribute('data-theme', config.tema);

      // Carrega médicos
      carregarMedicos();

      // Configura filtros
      configurarFiltros();

      // Configura modal de agendamento
      configurarModalAgendamento();

      // Logout
      document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        Storage.logout();
        window.location.href = 'login.html';
      });
    });

    function carregarMedicos(filtros = {}) {
      const medicos = Storage.getMedicos();
      const agendamentos = Storage.getAgendamentos();
      
      // Aplica filtros
      let medicosFiltrados = medicos;
      
      if (filtros.especialidade) {
        medicosFiltrados = medicosFiltrados.filter(m => 
          m.especialidade?.toLowerCase().includes(filtros.especialidade.toLowerCase())
        );
      }
      
      if (filtros.nome) {
        medicosFiltrados = medicosFiltrados.filter(m => 
          m.nome?.toLowerCase().includes(filtros.nome.toLowerCase())
        );
      }
      
      renderizarMedicos(medicosFiltrados, agendamentos);
      carregarEspecialidades(medicos);
    }

   function renderizarMedicos(medicos, agendamentos) {
  const grid = document.getElementById('medicosGrid');
  
  if (medicos.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <h3>Nenhum médico encontrado</h3>
        <p>Tente ajustar os filtros de busca</p>
      </div>
    `;
    return;
  }

  let html = '';
  
  medicos.forEach(medico => {
    // Calcula estatísticas reais do médico
    const consultasMedico = agendamentos.filter(a => a.medicoId == medico.id);
    const consultasHoje = consultasMedico.filter(a => {
      const hoje = new Date().toISOString().split('T')[0];
      return a.data === hoje;
    }).length;
    
    // Usa rating real do médico se disponível, caso contrário não mostra
    const rating = medico.rating || 0;
    const stars = rating > 0 ? '★'.repeat(rating) + '☆'.repeat(5 - rating) : 'Sem avaliações';
    
    html += `
      <div class="medico-card" data-medico-id="${medico.id}">
        <div class="medico-foto">
          ${medico.nome?.charAt(0) || 'M'}
        </div>
        
        <h3>${medico.nome}</h3>
        <div class="medico-especialidade">${medico.especialidade || 'Clínico Geral'}</div>
        
        ${rating > 0 ? `
          <div class="rating" title="${rating}/5 estrelas">
            ${stars}
          </div>
        ` : ''}
        
        <div class="medico-details">
          <div class="detail-item">
            <span>📧</span>
            <span>${medico.email || 'Email não informado'}</span>
          </div>
          
          <div class="detail-item">
            <span>📞</span>
            <span>${medico.telefone || 'Telefone não informado'}</span>
          </div>
          
          ${medico.crm ? `
            <div class="detail-item">
              <span>🆔</span>
              <span>CRM: ${medico.crm}</span>
            </div>
          ` : ''}
          
          <div class="detail-item">
            <span>📅</span>
            <span>${consultasHoje} consultas hoje</span>
          </div>
        </div>
        
        <div class="medico-actions" style="margin-top: var(--espaco-lg);">
          <button class="btn-primary" onclick="abrirModalAgendamento(${medico.id}, '${medico.nome}')">
            📅 Agendar Consulta
          </button>
          <button class="btn-secondary" onclick="verDetalhesMedico(${medico.id})">
            ℹ️ Ver Perfil
          </button>
        </div>
      </div>
    `;
  });
  
  grid.innerHTML = html;
}

    function carregarEspecialidades(medicos) {
      const especialidades = [...new Set(medicos.map(m => m.especialidade).filter(Boolean))];
      const select = document.getElementById('filtroEspecialidade');
      const list = document.getElementById('especialidadesList');
      
      // Limpa selects
      select.innerHTML = '<option value="">Todas as especialidades</option>';
      list.innerHTML = '<div class="especialidade-filter active" data-especialidade="">Todas</div>';
      
      // Preencha especialidades
      especialidades.forEach(esp => {
        // Select
        const option = document.createElement('option');
        option.value = esp;
        option.textContent = esp;
        select.appendChild(option);
        
        // Lista rápida
        const filter = document.createElement('div');
        filter.className = 'especialidade-filter';
        filter.dataset.especialidade = esp;
        filter.textContent = esp;
        filter.addEventListener('click', function() {
          document.querySelectorAll('.especialidade-filter').forEach(f => f.classList.remove('active'));
          this.classList.add('active');
          document.getElementById('filtroEspecialidade').value = esp;
          aplicarFiltros();
        });
        list.appendChild(filter);
      });
    }

    function configurarFiltros() {
      const filtroEspecialidade = document.getElementById('filtroEspecialidade');
      const filtroNome = document.getElementById('filtroNome');
      const btnBuscar = document.getElementById('btnBuscar');
      const btnLimpar = document.getElementById('btnLimpar');
      
      // Buscar
      btnBuscar.addEventListener('click', aplicarFiltros);
      
      // Limpar
      btnLimpar.addEventListener('click', () => {
        filtroEspecialidade.value = '';
        filtroNome.value = '';
        document.querySelectorAll('.especialidade-filter').forEach(f => f.classList.remove('active'));
        document.querySelector('.especialidade-filter[data-especialidade=""]').classList.add('active');
        carregarMedicos();
      });
      
      // Enter nos filtros
      [filtroEspecialidade, filtroNome].forEach(input => {
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') aplicarFiltros();
        });
      });
      
      // Busca em tempo real no nome
      filtroNome.addEventListener('input', debounce(aplicarFiltros, 300));
    }

    function aplicarFiltros() {
      const filtros = {
        especialidade: document.getElementById('filtroEspecialidade').value,
        nome: document.getElementById('filtroNome').value
      };
      
      carregarMedicos(filtros);
    }

    function configurarModalAgendamento() {
      const modal = document.getElementById('modalAgendar');
      const closeBtn = document.getElementById('closeModalAgendar');
      const form = document.getElementById('formAgendamentoRapido');
      
      closeBtn.addEventListener('click', () => modal.classList.remove('active'));
      
      window.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
      });
      
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const user = Storage.getUsuarioLogado();
        const pacientes = Storage.getPacientes();
        const paciente = pacientes.find(p => p.usuarioId == user.id) || pacientes.find(p => p.id == user.id);
        
        if (!paciente) {
          alert('Erro: Perfil de paciente não encontrado.');
          return;
        }
        
        const agendamento = {
          pacienteId: paciente.id,
          medicoId: parseInt(document.getElementById('medicoIdModal').value),
          data: document.getElementById('dataAgendamento').value,
          hora: document.getElementById('horaAgendamento').value,
          observacoes: document.getElementById('observacoesAgendamento').value,
          status: 'agendado',
          criadoEm: new Date().toISOString()
        };
        
        // Verifica se já existe agendamento no mesmo horário
        const agendamentos = Storage.getAgendamentos();
        const conflito = agendamentos.find(a => 
          a.medicoId == agendamento.medicoId && 
          a.data === agendamento.data && 
          a.hora === agendamento.hora &&
          a.status !== 'cancelado'
        );
        
        if (conflito) {
          alert('Este horário já está ocupado. Por favor, escolha outro horário.');
          return;
        }
        
        Storage.salvarAgendamento(agendamento);
        modal.classList.remove('active');
        form.reset();
        
        alert('Consulta agendada com sucesso!');
        
        // Redireciona para a página de consultas
        setTimeout(() => {
          window.location.href = 'paciente-consultas.html';
        }, 1000);
      });
    }

    function abrirModalAgendamento(medicoId, medicoNome) {
      document.getElementById('medicoNomeModal').textContent = medicoNome;
      document.getElementById('medicoIdModal').value = medicoId;
      
      // Define data mínima como hoje
      const hoje = new Date().toISOString().split('T')[0];
      document.getElementById('dataAgendamento').min = hoje;
      
      document.getElementById('modalAgendar').classList.add('active');
    }

    function verDetalhesMedico(medicoId) {
      const medico = Storage.getMedicos().find(m => m.id == medicoId);
      const agendamentos = Storage.getAgendamentos();
      const consultasMedico = agendamentos.filter(a => a.medicoId == medicoId);
      
      if (!medico) {
        alert('Médico não encontrado.');
        return;
      }
      
      const detalhes = `
        👨‍⚕️ Perfil do Médico
        
        Nome: ${medico.nome}
        Especialidade: ${medico.especialidade || 'Não informada'}
        ${medico.crm ? `CRM: ${medico.crm}` : ''}
        Email: ${medico.email || 'Não informado'}
        Telefone: ${medico.telefone || 'Não informado'}
        
        📊 Estatísticas:
        • Total de consultas: ${consultasMedico.length}
        • Consultas este mês: ${consultasMedico.filter(a => {
          const mesAtual = new Date().getMonth();
          const mesConsulta = new Date(a.data).getMonth();
          return mesConsulta === mesAtual;
        }).length}
        
        💡 Sobre:
        ${medico.sobre || 'Informações adicionais não disponíveis.'}
        
        ⚕️ Áreas de Atuação:
        ${medico.areas || 'Não especificado.'}
      `;
      
      alert(detalhes);
    }

    // Utilitário para debounce
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }
  </script>
