<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <link rel="manifest" href="pwa/manifest.json">
  <meta name="theme-color" content="#007bff">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CallMed - Login</title>

  <!-- Favicons -->
<link rel="icon" type="image/png" sizes="72x72" href="assets/images/icon-72x72.png">
<link rel="icon" type="image/png" sizes="96x96" href="assets/images/icon-96x96.png">
<link rel="icon" type="image/png" sizes="128x128" href="assets/images/icon-128x128.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon-192x192.png">
<link rel="apple-touch-icon" sizes="152x152" href="assets/images/icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/icon-152x152.png">
<link rel="manifest" href="pwa/manifest.json">

  <link rel="stylesheet" href="css/styles.css">
  
  <style>
    /* ============================================
       LOGIN PAGE - Estilos específicos
       ============================================ */
    body.login-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      height: auto;
      background: linear-gradient(135deg, #e0f0ff, #f0f2f5);
      padding: var(--espaco-md);
      margin: 0;
      overflow-x: hidden;
      overflow-y: auto;
    }

    [data-theme="dark"] body.login-page {
      background: linear-gradient(135deg, #1a202c, #2d3748);
    }

    [data-theme="blue"] body.login-page {
      background: linear-gradient(135deg, #ebf8ff, #bee3f8);
    }

    [data-theme="green"] body.login-page {
      background: linear-gradient(135deg, #f0fff4, #c6f6d5);
    }

    .login-container {
      background: var(--cor-card);
      padding: var(--espaco-xl);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 450px;
      animation: fadeIn 0.6s ease-in-out;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--espaco-lg);
    }

    .login-header h2 {
      color: var(--cor-principal);
      margin-bottom: var(--espaco-sm);
      font-size: 2rem;
    }

    .login-header p {
      color: var(--cor-secundaria);
      margin: 0;
    }

    .tipo-login {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--espaco-sm);
      margin-bottom: var(--espaco-lg);
      background: var(--cor-fundo);
      padding: var(--espaco-sm);
      border-radius: var(--radius-md);
    }

    .tipo-btn {
      padding: var(--espaco-sm);
      border: 2px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--cor-texto);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
      font-weight: 500;
    }

    .tipo-btn.active {
      background: var(--cor-principal);
      color: white;
      border-color: var(--cor-principal);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--espaco-md);
    }

    .login-form .form-group {
      margin-bottom: 0;
    }

    .login-error {
      color: var(--cor-erro);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 0.5rem;
      display: none;
    }

    .login-footer {
      margin-top: var(--espaco-lg);
      text-align: center;
      font-size: 0.9rem;
      color: var(--cor-secundaria);
    }

    .login-footer a {
      color: var(--cor-principal);
      font-weight: 500;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: var(--espaco-sm);
      font-size: 0.9rem;
      color: var(--cor-texto);
      cursor: pointer;
      margin-bottom: 0;
    }

    .remember-label input[type="checkbox"] {
      width: auto;
      margin: 0;
    }

    .demo-info {
      background: #e7f3ff;
      border: 1px solid #b3d9ff;
      border-radius: var(--radius-md);
      padding: var(--espaco-md);
      margin-top: var(--espaco-lg);
      font-size: 0.9rem;
    }

    [data-theme="dark"] .demo-info {
      background: #2c5282;
      border-color: #4299e1;
      color: #e2e8f0;
    }

    .demo-info h4 {
      color: var(--cor-principal);
      margin-bottom: var(--espaco-xs);
    }

    .demo-info p {
      margin: 5px 0;
      color: var(--cor-texto);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: var(--espaco-lg);
      }
      
      .tipo-login {
        grid-template-columns: 1fr;
      }

      .login-header h2 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-header">
      <h2>CallMed</h2>
      <p>Faça login na sua conta</p>
    </div>

    <form id="loginForm" class="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="Digite seu e-mail" required>
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>

      <label class="remember-label">
        <input type="checkbox" id="rememberMe"> 
        Lembrar-me
      </label>

      <button type="submit" class="btn-primary" style="width: 100%;">Entrar</button>
      <div class="login-error" id="loginError">E-mail ou senha incorretos!</div>
    </form>

    <div class="login-footer">
      <p>Não tem conta? <a href="#" id="abrirModalCadastro">Criar conta</a></p>
    </div>

    <div class="demo-info">
      <h4>💡 Contas de Demonstração:</h4>
      <p><strong>Admin:</strong> admin@AgendaMed.com / 123456</p>
      <p><strong>Médico:</strong> altemar@clinica.com / 123456</p>
      <p><strong>Sabrina Gabriella:</strong> sabrina@AgendaMed.com / 123456</p>
    </div>
  </div>

  <!-- Modal de Cadastro -->
  <div class="modal" id="modalCadastro">
    <div class="modal-content">
      <span class="modal-close" id="fecharModalCadastro">&times;</span>
      <h3>Criar Conta</h3>
      
      <div class="tipo-login" style="margin-bottom: var(--espaco-md);">
        <button type="button" class="tipo-btn active" data-tipo-cadastro="clinica">🏥 Clínica</button>
        <button type="button" class="tipo-btn" data-tipo-cadastro="paciente">👤 Paciente</button>
      </div>
      
      <form id="cadastroForm">
        <div class="form-group">
          <label for="novoNome">Nome Completo</label>
          <input type="text" id="novoNome" required>
        </div>

        <div class="form-group">
          <label for="novoEmail">E-mail</label>
          <input type="email" id="novoEmail" required>
        </div>

        <div class="form-group">
          <label for="novaSenha">Senha</label>
          <input type="password" id="novaSenha" required>
        </div>

        <button type="submit" class="btn-primary" style="width: 100%;">Cadastrar</button>
        <div class="login-error" id="cadastroError"></div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <!-- NÃO carregar components.js (não tem header no login) -->
  
  <script>
    // ============================================
    // LOGIN - INICIALIZAÇÃO
    // ============================================
    document.addEventListener('DOMContentLoaded', async () => {
      await Storage.ready;
      // Aplica tema
      const config = Storage.getConfiguracoes();
      document.documentElement.setAttribute('data-theme', config.tema);
      
      // Se já estiver logado, redireciona
      const usuarioLogado = Storage.getUsuarioLogado();
      if (usuarioLogado) {
        redirecionarPorTipoUsuario(usuarioLogado);
        return;
      }
      
      configurarLogin();
      configurarCadastro();
      configurarModal();
    });

    let tipoUsuario = 'clinica';

    function configurarLogin() {
      // Controle de tipo de usuário (caso queira usar)
      document.querySelectorAll('.tipo-btn[data-tipo]').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.tipo-btn[data-tipo]').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          tipoUsuario = this.dataset.tipo;
        });
      });

      // Submit do login
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('email').value.trim();
          const senha = document.getElementById('senha').value.trim();
          const loginError = document.getElementById('loginError');

          try {
          const user = await Storage.login(email, senha);

          if (user) {
            // Se for clínica sem tipoClinica definido, mostra modal
            if (user.tipo === 'clinica' && !user.tipoClinica) {
              mostrarModalTipoClinica(user);
            } else {
              redirecionarPorTipoUsuario(user);
            }
          } else {
            loginError.textContent = 'E-mail ou senha incorretos!';
            loginError.style.display = 'block';
          }
          } catch (error) {
            loginError.textContent = error.message;
            loginError.style.display = 'block';
          }
        });
      }
    }

    function mostrarModalTipoClinica(user) {
      const modalHTML = `
        <div class="modal active" id="modalTipoClinica">
          <div class="modal-content" style="max-width: 400px;">
            <h3>👨‍⚕️ Selecione seu Perfil</h3>
            <p>Como você atua na clínica?</p>
            
            <div style="display: flex; flex-direction: column; gap: 10px; margin: 20px 0;">
              <button type="button" class="tipo-clinica-btn" data-tipo-clinica="medico" style="padding: 15px; border: 2px solid var(--cor-borda); border-radius: 10px; background: var(--cor-fundo); cursor: pointer; text-align: left;">
                <strong>👨‍⚕️ Médico</strong>
                <div style="font-size: 0.9rem; color: var(--cor-secundaria); margin-top: 5px;">
                  Acesso à agenda, pacientes e consultas
                </div>
              </button>
              
              <button type="button" class="tipo-clinica-btn" data-tipo-clinica="secretario" style="padding: 15px; border: 2px solid var(--cor-borda); border-radius: 10px; background: var(--cor-fundo); cursor: pointer; text-align: left;">
                <strong>📋 Secretário(a)</strong>
                <div style="font-size: 0.9rem; color: var(--cor-secundaria); margin-top: 5px;">
                  Agendamentos, cadastros e atendimento
                </div>
              </button>
              
              <button type="button" class="tipo-clinica-btn" data-tipo-clinica="admin" style="padding: 15px; border: 2px solid var(--cor-borda); border-radius: 10px; background: var(--cor-fundo); cursor: pointer; text-align: left;">
                <strong>⚙️ Administrador</strong>
                <div style="font-size: 0.9rem; color: var(--cor-secundaria); margin-top: 5px;">
                  Acesso completo ao sistema
                </div>
              </button>
            </div>
            
            <button type="button" id="confirmarTipoClinica" class="btn-primary" style="width: 100%;" disabled>
              Confirmar e Entrar
            </button>
          </div>
        </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', modalHTML);
      
      let tipoSelecionado = null;
      
      document.querySelectorAll('.tipo-clinica-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.tipo-clinica-btn').forEach(b => {
            b.style.borderColor = 'var(--cor-borda)';
            b.style.background = 'var(--cor-fundo)';
          });
          
          this.style.borderColor = 'var(--cor-principal)';
          this.style.background = 'var(--cor-destaque)';
          
          tipoSelecionado = this.dataset.tipoClinica;
          document.getElementById('confirmarTipoClinica').disabled = false;
        });
      });
      
      document.getElementById('confirmarTipoClinica').addEventListener('click', () => {
        if (tipoSelecionado) {
          user.tipoClinica = tipoSelecionado;
          localStorage.setItem('usuarioLogado', JSON.stringify(user));
          redirecionarPorTipoUsuario(user);
          document.getElementById('modalTipoClinica').remove();
        }
      });
    }

    function redirecionarPorTipoUsuario(usuario) {
  console.log('🚀 Redirecionando usuário:', usuario.nome, 'Tipo:', usuario.tipo, 'TipoClinica:', usuario.tipoClinica);
  
  if (usuario.tipo === 'paciente') {
    console.log('👤 Redirecionando para paciente.html');
    window.location.href = 'paciente.html';
  } else if (usuario.tipo === 'clinica') {
    console.log('🏥 Redirecionando para admin.html');
    window.location.href = 'admin.html';
  } else {
    // Fallback: se tipo não definido, assume clínica
    console.warn('⚠️ Tipo não definido, assumindo clinica');
    window.location.href = 'admin.html';
  }
}

    function configurarModal() {
      const modalCadastro = document.getElementById('modalCadastro');
      const abrirModalCadastro = document.getElementById('abrirModalCadastro');
      const fecharModalCadastro = document.getElementById('fecharModalCadastro');

      if (abrirModalCadastro) {
        abrirModalCadastro.addEventListener('click', e => {
          e.preventDefault();
          modalCadastro.classList.add('active');
        });
      }

      if (fecharModalCadastro) {
        fecharModalCadastro.addEventListener('click', () => {
          modalCadastro.classList.remove('active');
        });
      }

      window.addEventListener('click', e => {
        if (e.target === modalCadastro) modalCadastro.classList.remove('active');
      });
    }

    function configurarCadastro() {
  // Controle de tipo no cadastro
  document.querySelectorAll('.tipo-btn[data-tipo-cadastro]').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tipo-btn[data-tipo-cadastro]').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      console.log('📋 Tipo de cadastro selecionado:', this.dataset.tipoCadastro);
    });
  });

  // Submit do cadastro
  const cadastroForm = document.getElementById('cadastroForm');
  if (cadastroForm) {
    cadastroForm.addEventListener('submit', async e => {
      e.preventDefault();
      const nome = document.getElementById('novoNome').value.trim();
      const email = document.getElementById('novoEmail').value.trim();
      const senha = document.getElementById('novaSenha').value.trim();
      
      // ✅ Pega o tipo ATIVO
      const tipoAtivo = document.querySelector('.tipo-btn[data-tipo-cadastro].active');
      const tipoCadastro = tipoAtivo ? tipoAtivo.dataset.tipoCadastro : 'clinica';
      
      console.log('📝 Cadastrando:', { nome, email, tipoCadastro });
      
      const erro = document.getElementById('cadastroError');

      if (!nome || !email || !senha) {
        erro.textContent = 'Preencha todos os campos.';
        erro.style.display = 'block';
        return;
      }

      let novoUsuario;
      try {
        novoUsuario = await Storage.criarUsuario(nome, email, senha, tipoCadastro);
      } catch (error) {
        erro.textContent = error.message;
        erro.style.display = 'block';
        return;
      }

      alert('Conta criada com sucesso! Agora você pode fazer login.');
      document.getElementById('modalCadastro').classList.remove('active');
      cadastroForm.reset();
    });
  }
}
  </script>
</body>
</html>
