<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
<meta name="theme-color" content="#007bff">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CallMed - Agendar Consulta</title>
  <!-- 1. BASE primeiro -->
<link rel="stylesheet" href="base.css">

<!-- 2. THEME segundo -->
<link rel="stylesheet" href="theme.css">

<!-- 3. LAYOUT e outros depois -->
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="forms.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="animations.css">
<style>

 .btn-delete, .btn-edit {
  background: var(--cor-info);
  color: rgb(10, 0, 0);
  border: none;
  padding: 5px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.3s ease;
}

.btn-delete {
  background: var(--cor-erro);
}

.btn-delete:hover, .btn-edit:hover {
  opacity: 0.8;
  transform: translateY(-1px);
}

  .badge {
  padding: 4px 8px;
  border-radius: 12px;
  font-size: 0.8rem;
  font-weight: bold;
  text-transform: uppercase;
}

.badge.agendado {
  background: var(--cor-info);
  color: rgb(0, 0, 0);
}

.badge.confirmado {
  background: var(--cor-sucesso);
  color: white;
}

.badge.cancelado {
  background: var(--cor-erro);
  color: white;
}

.badge.pendente {
  background: var(--cor-aviso);
  color: black;
}
</style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="logo.png" alt="CallMed Logo">
      <span>CallMed</span>
    </div>
    <nav class="nav">
      <ul>
 <li><a href="index.html">Dashboard</a></li>
 <li><a href="clinicas.html">Clínicas</a></li>
        <li><a href="pacientes.html">Pacientes</a></li>
        <li><a href="medicos.html">Médicos</a></li>
        <li><a href="agendar.html" class="active">Agendar</a></li>
        <li><a href="medico-chatbot.html">Chatbot</a></li>
        <li><a href="historico.html">Histórico</a></li>
        <li><a href="configuracoes.html">Configurações</a></li>
        <li><a href="ajuda.html">Ajuda</a></li>
        <li><a href="#" id="logoutBtn">Sair</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Agendar Consulta</h1>
      <button class="btn-add" id="openModalBtn">+ Nova Consulta</button>
    </div>

    <section class="dashboard-grid">
      <table id="agendamentosTable">
        <thead>
          <tr>
            <th>Paciente</th>
            <th>Médico</th>
            <th>Data</th>
            <th>Hora</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <div class="modal" id="modalAgendamento">
    <div class="modal-content">
      <span class="modal-close" id="closeModalBtn">&times;</span>
      <h2>📅 Nova Consulta</h2>
      <form id="agendamentoForm">
        <div class="form-group">
          <label for="pacienteSelect">👤 Paciente</label>
          <select id="pacienteSelect" required>
            <option value="">Selecione um paciente</option>
          </select>
        </div>

        <div class="form-group">
          <label for="medicoSelect">🩺 Médico</label>
          <select id="medicoSelect" required>
            <option value="">Selecione um médico</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dataConsulta">📅 Data</label>
            <input type="date" id="dataConsulta" required>
          </div>

          <div class="form-group">
            <label for="horaConsulta">⏰ Hora</label>
            <input type="time" id="horaConsulta" required>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">✅ Agendar Consulta</button>
          
        </div>
      </form>
    </div>
  </div>

  <footer class="footer">
  <div class="footer-content">
    <span class="footer-creator">Criado por Iury Gabriel Barreto</span>
    <span class="footer-version">v1.0</span>
  </div>
</footer>

  <script src="storage.js"></script>
  <script src="agendamento.js"></script>
 <script>
// SISTEMA DE TEMA GLOBAL UNIVERSAL - CallMed
document.addEventListener('DOMContentLoaded', function() {
  // Carrega configurações
  const config = JSON.parse(localStorage.getItem('CallMed_config') || '{"tema":"light","notificacoes":true}');
  
  console.log('🌙 Aplicando tema CallMed em:', window.location.pathname, 'Tema:', config.tema);
  
  // 1. Aplica tema no HTML
  document.documentElement.setAttribute('data-theme', config.tema);
  
  // 2. Força cores no body
  document.body.style.backgroundColor = 'var(--cor-fundo)';
  document.body.style.color = 'var(--cor-texto)';
  document.body.style.transition = 'background-color 0.3s ease, color 0.3s ease';
  
  // 3. Aplica tema em elementos específicos baseado na página
  setTimeout(() => {
    // Para todas as páginas
    const elementos = document.querySelectorAll('.card, .modal-content, table, .login-container, .config-section, .perfil-section, .ajuda-container, .tabela-container, .filtros');
    elementos.forEach(el => {
      if (el) {
        el.style.backgroundColor = 'var(--cor-card)';
        el.style.color = 'var(--cor-texto)';
      }
    });
    
    // Para inputs
    document.querySelectorAll('input, select, textarea').forEach(input => {
      input.style.backgroundColor = 'var(--cor-card)';
      input.style.color = 'var(--cor-texto)';
      input.style.borderColor = 'var(--cor-borda)';
    });
    
    // Para header
    const header = document.querySelector('.header');
    if (header) {
      header.style.backgroundColor = 'var(--cor-principal)';
    }
  }, 100);
  
  // 4. Escuta mudanças de tema em tempo real
  window.addEventListener('temaAlterado', function(e) {
    console.log('🔄 Tema alterado para:', e.detail);
    
    // Atualiza tema
    document.documentElement.setAttribute('data-theme', e.detail);
    
    // Força atualização visual
    document.body.style.backgroundColor = 'var(--cor-fundo)';
    document.body.style.color = 'var(--cor-texto)';
    
    // Recarrega elementos específicos
    setTimeout(() => {
      document.querySelectorAll('.card, .modal-content, table, .login-container').forEach(el => {
        if (el) {
          el.style.backgroundColor = 'var(--cor-card)';
          el.style.color = 'var(--cor-texto)';
        }
      });
    }, 50);
  });
  
  // 5. Escuta mudanças no storage entre abas
  window.addEventListener('storage', function(e) {
    if (e.key === 'CallMed_config') {
      console.log('📦 Storage alterado, atualizando tema...');
      const newConfig = JSON.parse(e.newValue || '{"tema":"light"}');
      document.documentElement.setAttribute('data-theme', newConfig.tema);
      document.body.style.backgroundColor = 'var(--cor-fundo)';
      document.body.style.color = 'var(--cor-texto)';
    }
  });

 document.getElementById('logoutBtn').addEventListener('click', function(e) {
        e.preventDefault();
        Storage.logout();
        window.location.href = 'login.html';
      });
    });

</script>
</body>
</html>
